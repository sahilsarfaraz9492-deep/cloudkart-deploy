apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudkart-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudkart-frontend
  template:
    metadata:
      labels:
        app: cloudkart-frontend
    spec:
      containers:
        - name: frontend
          image: sahilsarfaraz/cloudkart-frontend:6
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cloudkart-frontend
spec:
  selector:
    app: cloudkart-frontend
  ports:
    - port: 80
      targetPort: 80
